<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квадратное уравнение и вклад</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

<div class="container">
    <h1 class="display-3 text-center">ax&sup2; + bx + c = 0</h1>
</div>

<div class="container my-5">
    <div class="row">
        <div class="col-md-4">
            <img class="img-fluid" src="https://yagubov.ru/_bd/92/38355674.jpg" alt="Формула">
        </div>

        <div class="col-md-4">
            <form action="javascript:square()">
                <div class="mb-3">
                    <label class="form-label">a</label>
                    <input class="form-control" type="number" step="any" id="A">
                </div>
                <div class="mb-3">
                    <label class="form-label">b</label>
                    <input class="form-control" type="number" step="any" id="B">
                </div>
                <div class="mb-3">
                    <label class="form-label">c</label>
                    <input class="form-control" type="number" step="any" id="C">
                </div>
                <button class="btn btn-success" type="submit">Посчитать</button>
            </form>
        </div>

        <div class="col-md-4">
            <h2>Корни</h2>
            <ul id="korni" class="list-group"></ul>
        </div>
    </div>

    <hr class="my-5">

    <div class="row">
        <div class="col-md-5">
            <form name="calculator">
                <div class="mb-3">
                    <label class="form-label">Сумма вклада</label>
                    <input class="form-control" type="number" name="money" value="10000">
                </div>
                <div class="mb-3">
                    <label class="form-label">Срок (месяцев)</label>
                    <select class="form-select" name="months">
                        <option value="3">3</option>
                        <option value="6">6</option>
                        <option value="12">12</option>
                        <option value="18">18</option>
                        <option value="24">24</option>
                        <option value="30">30</option>
                        <option value="36">36</option>
                        <option value="42">42</option>
                        <option value="48">48</option>
                        <option value="54">54</option>
                        <option value="60">60</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Ставка, % годовых</label>
                    <input class="form-control" type="number" name="stavka" value="5">
                </div>
            </form>
        </div>

        <div class="col-md-5">
            <table class="table table-bordered w-auto">
                <tr><th>Было</th><th>Станет</th></tr>
                <tr>
                    <td id="mon-before"></td>
                    <td id="mon-after"></td>
                </tr>
                <tr>
                    <td style="vertical-align: bottom;">
                        <div style="background: red; width: 40px; height: 100px; border: 1px solid;"></div>
                    </td>
                    <td style="vertical-align: bottom;">
                        <div id="gist" style="background: limegreen; width: 40px; height: 0px; border: 1px solid;"></div>
                    </td>
                </tr>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="my.js"></script>
</body>
</html>
